name: V2 Research Artifact Cache

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/best-of-v2
    paths:
      - "src/lib/researchArtifactCache.js"
      - "scripts/apply-v2-research-artifact-cache.js"
      - "scripts/check-v2-research-artifact-cache.js"
      - ".github/workflows/v2-research-artifact-cache.yml"

concurrency:
  group: v2-research-artifact-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/best-of-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Research artifact cache integration
        run: |
          node scripts/apply-v2-research-artifact-cache.js
          node --check src/lib/researchArtifactCache.js
          node --check src/lib/codexRunner.js
          node --check src/lib/jobDiagnostics.js
          node --check src/main.js

      - name: Check Research artifact cache and measured skip diagnostics
        run: node scripts/check-v2-research-artifact-cache.js

      - name: Run repository checks
        run: npm run check

      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/codexRunner.js src/lib/jobDiagnostics.js src/main.js
          git commit -m "feat: integrate safe Research artifact cache"
          git push origin HEAD:upgrade/best-of-v2
