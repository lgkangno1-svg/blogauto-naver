name: V2 Core Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/best-of-v2
    paths:
      - "src/lib/qualityGate.js"
      - "src/lib/tokenPolicy.js"
      - "src/lib/evidenceLedger.js"
      - "scripts/apply-v2-core.js"
      - "scripts/apply-v2-ui.js"
      - "scripts/check-v2.js"
      - ".github/workflows/v2-core-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/best-of-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply idempotent V2 patches
        run: |
          node scripts/apply-v2-core.js
          node scripts/apply-v2-ui.js

      - name: Syntax check upgraded modules
        run: |
          node --check src/lib/qualityGate.js
          node --check src/lib/tokenPolicy.js
          node --check src/lib/evidenceLedger.js
          node --check src/lib/codexRunner.js
          node --check src/lib/settings.js
          node --check src/renderer/app.js

      - name: Run V2 regression checks
        run: node scripts/check-v2.js

      - name: Run repository checks
        run: npm run check

      - name: Commit generated V2 integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/codexRunner.js src/lib/settings.js src/renderer/index.html src/renderer/app.js
          git commit -m "feat: integrate V2 evidence quality token and UI policies"
          git push origin HEAD:upgrade/best-of-v2
