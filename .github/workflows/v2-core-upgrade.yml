name: V2 Core Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/best-of-v2
    paths:
      - "src/lib/qualityGate.js"
      - "src/lib/tokenPolicy.js"
      - "src/lib/evidenceLedger.js"
      - "src/lib/publishSafety.js"
      - "src/lib/partialRepair.js"
      - "src/lib/titleNovelty.js"
      - "scripts/apply-v2-core.js"
      - "scripts/apply-v2-ui.js"
      - "scripts/apply-v2-publish-safety.js"
      - "scripts/apply-v2-partial-repair.js"
      - "scripts/apply-v2-early-title-gate.js"
      - "scripts/check-v2.js"
      - "scripts/check-v2-early-title-gate.js"
      - ".github/workflows/v2-core-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/best-of-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply idempotent V2 patches
        run: |
          node scripts/apply-v2-core.js
          node scripts/apply-v2-ui.js
          node scripts/apply-v2-publish-safety.js
          node scripts/apply-v2-partial-repair.js
          node scripts/apply-v2-early-title-gate.js

      - name: Syntax check V2 policy modules
        run: |
          node --check src/lib/qualityGate.js
          node --check src/lib/tokenPolicy.js
          node --check src/lib/evidenceLedger.js
          node --check src/lib/publishSafety.js
          node --check src/lib/partialRepair.js
          node --check src/lib/titleNovelty.js

      - name: Diagnose generated Codex runner syntax
        id: runner_syntax
        shell: bash
        run: |
          rm -f v2-syntax-diagnostic.txt
          if node --check src/lib/codexRunner.js 2>v2-syntax-diagnostic.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            rm -f v2-syntax-diagnostic.txt
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            printf '\n--- early-title region ---\n' >> v2-syntax-diagnostic.txt
            grep -n -A45 -B12 "earlyTitleNovelty" src/lib/codexRunner.js >> v2-syntax-diagnostic.txt || true
          fi

      - name: Commit syntax diagnostic
        if: steps.runner_syntax.outputs.ok == 'false'
        shell: bash
        run: |
          git checkout -- src/lib/codexRunner.js src/lib/naverPublisher.js src/lib/settings.js src/main.js src/renderer/index.html src/renderer/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2-syntax-diagnostic.txt
          git commit -m "chore: capture V2 runner syntax diagnostic"
          git push origin HEAD:upgrade/best-of-v2

      - name: Require generated Codex runner syntax
        if: steps.runner_syntax.outputs.ok == 'false'
        run: exit 1

      - name: Syntax check publishing integration
        if: steps.runner_syntax.outputs.ok == 'true'
        run: |
          node --check src/lib/naverPublisher.js
          node --check src/lib/settings.js
          node --check src/main.js
          node --check src/renderer/app.js

      - name: Run V2 regression checks
        if: steps.runner_syntax.outputs.ok == 'true'
        run: |
          node scripts/check-v2.js
          node scripts/check-v2-early-title-gate.js

      - name: Run repository checks
        if: steps.runner_syntax.outputs.ok == 'true'
        run: npm run check

      - name: Commit generated V2 integration
        if: steps.runner_syntax.outputs.ok == 'true'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/codexRunner.js src/lib/naverPublisher.js src/lib/settings.js src/main.js src/renderer/index.html src/renderer/app.js
          git commit -m "feat: integrate V2 evidence quality token UI publish safety partial repair and early duplicate gate"
          git push origin HEAD:upgrade/best-of-v2
