name: V2 Core Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade/best-of-v2
    paths:
      - "src/lib/qualityGate.js"
      - "src/lib/tokenPolicy.js"
      - "src/lib/evidenceLedger.js"
      - "src/lib/publishSafety.js"
      - "scripts/apply-v2-core.js"
      - "scripts/apply-v2-ui.js"
      - "scripts/apply-v2-publish-safety.js"
      - "scripts/check-v2.js"
      - ".github/workflows/v2-core-upgrade.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/best-of-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply idempotent V2 patches
        run: |
          node scripts/apply-v2-core.js
          node scripts/apply-v2-ui.js
          node scripts/apply-v2-publish-safety.js

      - name: Syntax check upgraded modules
        run: |
          node --check src/lib/qualityGate.js
          node --check src/lib/tokenPolicy.js
          node --check src/lib/evidenceLedger.js
          node --check src/lib/publishSafety.js
          node --check src/lib/codexRunner.js
          node --check src/lib/naverPublisher.js
          node --check src/lib/settings.js
          node --check src/main.js
          node --check src/renderer/app.js

      - name: Run V2 regression checks
        run: node scripts/check-v2.js

      - name: Run repository checks
        id: legacy-check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee v2-ci-check.log

      - name: Report compatibility failure
        if: steps.legacy-check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### V2 compatibility check failure'
            echo '```text'
            tail -n 80 v2-ci-check.log
            echo '```'
          } > v2-pr-diagnostic.md
          gh pr comment 1 --body-file v2-pr-diagnostic.md
          exit 1

      - name: Commit generated V2 integration
        if: steps.legacy-check.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/codexRunner.js src/lib/naverPublisher.js src/lib/settings.js src/main.js src/renderer/index.html src/renderer/app.js
          git commit -m "feat: integrate V2 evidence quality token UI and publish safety policies"
          git push origin HEAD:upgrade/best-of-v2
